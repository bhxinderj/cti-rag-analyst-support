# =============================================================================
# CTI-RAG Prototype Configuration
# Master Thesis: Bhinder (2026)
# =============================================================================
# All parameters centralized here for scientific reproducibility.
# Document any changes with date and rationale.

# --- LLM Configuration ---
llm:
  model_name: "llama3.1:8b-instruct-q5_K_M"
  base_url: "http://localhost:11434"
  temperature: 0.1          # Low temperature for factual CTI responses
  top_p: 0.9
  max_tokens: 2048
  request_timeout: 120      # seconds

# --- Embedding Configuration ---
embedding:
  model_name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  device: "mps"             # Apple Silicon Metal Performance Shaders
  batch_size: 64

# --- Retrieval Configuration ---
retrieval:
  entity_match_boost: 1.0    # Small exact-ID bonus after reranking; keeps CTI identifiers visible without dominating base scores
  vector:
    collection_name: "cti_documents"
    top_k: 20                # Initial retrieval candidates
    similarity_metric: "cosine"
  bm25:
    top_k: 20                # Initial retrieval candidates
    index_path: "data/indexes/bm25_index.json"
  fusion:
    method: "rrf"            # Reciprocal Rank Fusion
    rrf_k: 60                # Standard RRF constant
    top_k: 10                # After fusion, before reranking
  reranker:
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_k: 5                 # Final context chunks for LLM

# --- Chunking Configuration ---
chunking:
  default_max_tokens: 512
  overlap_tokens: 50         # Only used as fallback for oversized chunks
  strategy: "semantic"       # CTI-aware chunking (1 CVE = 1 chunk, etc.)

# --- Data Sources ---
data:
  snapshot_date: "2025-12-31"  # Static dataset cutoff for reproducibility
  sources:
    nvd:
      raw_dir: "data/raw/nvd"
      min_cvss: 7.0            # Filter: only HIGH and CRITICAL
      year_range: [2020, 2025]
    cisa_kev:
      raw_dir: "data/raw/cisa_kev"
    cisa_advisories:
      raw_dir: "data/raw/cisa_advisories"
    misp:
      raw_dir: "data/raw/misp"

# --- ChromaDB Configuration ---
chromadb:
  persist_directory: "data/indexes/chromadb"
  anonymized_telemetry: false

# --- Evaluation Configuration ---
evaluation:
  ragas:
    metrics:
      - faithfulness
      - answer_relevancy
      - answer_correctness
      - context_precision
      - context_recall
    eval_llm: "qwen2.5:7b-instruct"  # Separate model to avoid same-model eval bias
  query_set_path: "configs/eval_queries.yaml"
  results_dir: "data/evaluation_results"

# --- Reproducibility ---
random_seed: 42
