llm:
  model_name: llama3.1:8b-instruct-q5_K_M
  base_url: http://localhost:11434
  temperature: 0.1
  top_p: 0.9
  max_tokens: 2048
  request_timeout: 120
embedding:
  model_name: BAAI/bge-small-en-v1.5
  dimension: 384
  device: mps
  batch_size: 64
retrieval:
  entity_match_boost: 1.0
  vector:
    collection_name: cti_documents
    top_k: 20
    similarity_metric: cosine
  bm25:
    top_k: 20
    index_path: data/indexes/bm25_index.json
  fusion:
    method: rrf
    rrf_k: 60
    top_k: 20
  reranker:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_k: 5
chunking:
  default_max_tokens: 512
  overlap_tokens: 50
  strategy: semantic
data:
  snapshot_date: '2025-12-31'
  sources:
    nvd:
      raw_dir: data/raw/nvd
      min_cvss: 7.0
      year_range:
      - 2020
      - 2025
    cisa_kev:
      raw_dir: data/raw/cisa_kev
    cisa_advisories:
      raw_dir: data/raw/cisa_advisories
      year_range:
      - 2020
      - 2025
    misp:
      raw_dir: data/raw/misp
chromadb:
  persist_directory: data/indexes/chromadb
  anonymized_telemetry: false
evaluation:
  ragas:
    metrics:
    - faithfulness
    - answer_relevancy
    - answer_correctness
    - context_precision
    - context_recall
    eval_llm_provider: openrouter
    eval_llm: qwen2.5:7b-instruct
    eval_llm_openai: gpt-4o-mini
    eval_llm_openrouter: openai/gpt-4o-mini
  query_set_path: configs/eval_queries.yaml
  results_dir: data/evaluation_results
random_seed: 42
