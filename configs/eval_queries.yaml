      mitigations_min_count: 1
    # Verified: KEV ✓ (all three ransomware: Known)
    # Question revised 2026-07-18 (Class A): the original open enumeration
    # ("Which specific vulnerabilities ... are flagged ...") admits 313 correct
    # answers in the KEV snapshot and retrieval surfaced arbitrary KEV entries,
    # so any correct answer scored 0.2–0.3. Rephrased as a verification question
    # over three named CVEs (drawn from the original GT examples) so the answer
    # set is uniquely retrievable via entity-aware augmentation.
    # Field-coverage anchor on entities[0] = CVE-2021-44228: data/raw/nvd
