# =============================================================================
# CTI Evaluation Query Set
# Master Thesis: Bhinder (2026)
# =============================================================================
# Representative CTI queries for prototype evaluation.
# Organized by task type (maps to SRQ2 scenarios).
#
# Each query includes:
#   - question: the natural language query
#   - task_type: vulnerability_analysis | ioc_enrichment | ttp_correlation | cross_source
#   - template_expected: router target (VulnTriage | ThreatContext | CrossSourceCompare);
#     asserted by tests/test_query_router.py against src/cti_rag/rag/router.py
#   - ground_truth_points: expected answer as one fact per point (joined to
#     ground_truth by main._load_eval_queries for RAGAS)
#   - required_fields: Field-Coverage expectations (src/cti_rag/evaluation/field_coverage.py)
#   - difficulty: simple | moderate | complex
#
# Design decisions (document in thesis section 2.3.3):
#   - 28 queries: 7 per task type (vuln, ioc, ttp, cross-source)
#   - Ground truths are fact-checkable against the indexed snapshot (NVD, CISA
#     KEV, CISA advisories, MISP; snapshot cutoff 2025-12-31). Facts that exist
#     in data/raw but have no chunk in the Setup-B index (e.g. missing NVD docs
#     for CVE-2021-44228, CVE-2023-22515, CVE-2024-1709) are NOT claimed.
#   - GT review 2026-07-18: open enumeration questions were narrowed to named
#     entity sets so the correct answer set is uniquely retrievable (Class A),
#     and ground truths were reduced to snapshot-backed core facts (Class B).
#     Question revisions are annotated per query; IDs are stable.
#   - Temporal references use absolute dates aligned with data snapshot (2025-12-31)
#   - CVSS scores match NVD cvssMetricV31 values from indexed data

queries:
  # ===========================================================================
  # Task Type 1: Vulnerability Analysis (7 queries)
  # ===========================================================================
  - id: vuln_001
    question: "What is CVE-2024-3094 and what is its impact?"
    task_type: vulnerability_analysis
    template_expected: VulnTriage
    ground_truth_points:
      - "CVE-2024-3094 is a critical supply chain compromise in the XZ Utils (liblzma) compression library, classified as CWE-506 (embedded malicious code)."
      - "Malicious code in the upstream xz tarballs, starting with version 5.6.0, modifies the liblzma build so that the resulting library can intercept and modify data interactions of any software linked against it."
      - "The NVD CVSS v3.1 base score is 10.0 (critical)."
      - "CVE-2024-3094 is not listed in the CISA KEV catalog in the snapshot, and no ransomware campaign use is recorded."
    difficulty: simple
    required_fields:
      cve_id: "CVE-2024-3094"
      cvss_score: 10.0
      cwe_ids: ["CWE-506"]
      affected_products: ["Tukaani Xz", "XZ Utils"]
      kev_listed: false
      ransomware_use: false
      triage_signal: "high"
      mitigations_min_count: 1
    # Verified: NVD ✓ (CVSS 10.0, CWE-506, CPE tukaani:xz 5.6.0/5.6.1) | KEV ✗ absent
    # GT review 2026-07-18 (Class B): dropped "SSH authentication bypass" — not
    # in the NVD description ("intercepting and modifying the data interaction
    # with this library"); added the KEV-absence fact (deliberate absence case).
    # triage_signal is "high" not "critical": CVSS >= 9 without KEV/ransomware
    # maps to "HIGH — Review" (severity.py rule table).

  - id: vuln_002
    question: "Which critical vulnerabilities affect Apache Log4j and what are the recommended mitigations?"
    task_type: vulnerability_analysis
    template_expected: VulnTriage
    ground_truth_points:
      - "CVE-2021-44228 (Log4Shell) is a critical remote code execution vulnerability in Apache Log4j2."
      - "The JNDI features of Log4j2 do not protect against attacker-controlled JNDI-related endpoints, allowing attackers who can control log messages to execute arbitrary code."
      - "CISA advisory AA21-356A reports Log4j versions 2.0-beta9 to 2.14.1 as affected by Log4Shell."
      - "CVE-2021-44228 is listed in the CISA KEV catalog as actively exploited with known ransomware campaign use."
      - "CISA's required action is to apply updates or remove affected assets from agency networks, with temporary mitigations per Emergency Directive ED 22-02 acceptable only until updates are available."
    difficulty: moderate
    # Verified: KEV ✓ (ransomware: Known, requiredAction cites ED 22-02) |
    # CISA advisory AA21-356A ✓ (affected versions, upgrade guidance)
    # Index note: nvd_CVE-2021-44228 has NO chunk in the Setup-B index — the
    # prior CVSS 10.0 / CWE-20 claims were not retrievable and were removed.
    # Field-coverage note: the question names no CVE, so the router falls back
    # to VulnTriage (rule 7) with empty primary entities and the fact bundle
    # carries no L1 entity card. Only the L2 mitigations field is checkable.
    required_fields:
      mitigations_min_count: 1

  - id: vuln_003
    question: "Compare the severity and attack vectors of the Microsoft Exchange Server vulnerabilities CVE-2021-26855 (ProxyLogon), CVE-2021-34473 (ProxyShell), and CVE-2022-41040/CVE-2022-41082 (ProxyNotShell)."
    task_type: cross_source
    template_expected: CrossSourceCompare
    ground_truth_points:
      - "CVE-2021-26855 (ProxyLogon) is a Microsoft Exchange Server vulnerability classified as CWE-918 (server-side request forgery) with a CVSS v3.1 score of 9.1."
      - "CVE-2021-34473 (ProxyShell) is a Microsoft Exchange Server remote code execution vulnerability (CWE-918) with a CVSS v3.1 score of 9.1."
      - "CVE-2022-41040 is a Microsoft Exchange Server server-side request forgery vulnerability (CWE-918, CVSS 8.8) dubbed ProxyNotShell, chainable with CVE-2022-41082."
      - "CVE-2022-41082 (CVSS 8.0, CWE-502) provides the remote code execution half of the ProxyNotShell chain."
      - "CVE-2022-41082 requires adjacent network access and low privileges (AV:A/PR:L), whereas CVE-2021-26855 and CVE-2021-34473 are network-reachable without authentication (AV:N/PR:N)."
      - "All four vulnerabilities are listed in the CISA KEV catalog as actively exploited with known ransomware campaign use."
    difficulty: complex
    required_fields:
      expected_entities: ["CVE-2021-26855", "CVE-2021-34473", "CVE-2022-41040", "CVE-2022-41082"]
      expected_entities_min_matches: 3
      cross_source_facts_min_count: 2
    # Verified: NVD ✓ (CWE-918, CWE-918, CWE-918, CWE-502; vectors AV:N,
    # AV:N, AV:N, AV:A; indexed CVSS 9.1/9.1/8.8/8.0 — for 26855/34473 the
    # NVD record carries two v3.1 metrics, 9.1 secure@microsoft.com and 9.8
    # nvd@nist.gov; the Setup-B index stores 9.1, which the L1 card renders)
    # | KEV ✓ (all ransomware: Known, ProxyNotShell chaining noted in KEV
    # shortDescriptions, "ProxyLogon exploit chain" named for 26855;
    # "ProxyShell" named in advisory AA21-321A)
    # task_type revised from vulnerability_analysis to cross_source during
    # router-validation review: the question is explicitly comparative and
    # spans multiple CVEs, which matches CrossSourceCompare semantics.
    # Question revised 2026-07-18 (Class A structural): the open phrasing
    # "recent Microsoft Exchange Server vulnerabilities" admitted many correct
    # answer sets while retrieval surfaced the ProxyLogon chain (CVE-2021-26858,
    # CVE-2021-27065) instead of the GT set. Naming the four CVEs makes the
    # answer set deterministic via entity-aware augmentation.

  - id: vuln_004
    question: "What is CVE-2023-4966 (Citrix Bleed) and how severe is it?"
    task_type: vulnerability_analysis
    template_expected: VulnTriage
    ground_truth_points:
      - "CVE-2023-4966 (Citrix Bleed) is a sensitive information disclosure vulnerability (CWE-119) in Citrix NetScaler ADC and NetScaler Gateway when configured as a Gateway or AAA virtual server."
      - "NVD's primary metric scores it CVSS 7.5 (high, vector C:H/I:N/A:N), while the Citrix vendor metric recorded in the same NVD entry scores it 9.4 (critical) — a cross-source severity divergence."
      - "Exploitation allows unauthenticated attackers to read sensitive information from device memory, including session tokens that enable session hijacking."
      - "It is listed in the CISA KEV catalog (added 2023-10-18) as actively exploited with known ransomware campaign use, notably by LockBit 3.0."
      - "CISA's required action includes applying mitigations and killing all active and persistent sessions per vendor instructions."
    difficulty: simple
    required_fields:
      cve_id: "CVE-2023-4966"
      cvss_score: 7.5
      cwe_ids: ["CWE-119"]
      affected_products: ["Citrix NetScaler ADC", "Citrix NetScaler Gateway"]
      kev_listed: true
      ransomware_use: true
      triage_signal: "high"
      mitigations_min_count: 1
    # Verified against Setup-B index: NVD ✓ (CVSS 7.5 nvd@nist.gov Primary;
    # 9.4 exists as the secure@citrix.com Secondary metric inside the same
    # NVD record — NOT in advisory AA23-325A) | KEV ✓ (ransomware: Known,
    # requiredAction "kill all active and persistent sessions", CWE-119 in
    # KEV cwes) | advisory AA23-325A ✓ (LockBit 3.0, session hijacking)
    # Annotation note (2026-04-14): NVD CVSS-3.1 calculates 7.5 for vector
    # C:H/I:N/A:N. The Citrix vendor advisory CTX579459 scored this issue
    # 9.4 using a different weighting. Prior revisions of this annotation
    # used 9.4 / "critical"; the L1 smoke test surfaced the mismatch. The
    # divergence itself is a thesis finding (Chapter 5 Discussion: "when
    # deterministic severity rules disagree with vendor scoring, the
    # triage card must surface the inconsistency, not hide it"). See
    # FactBundle.inconsistencies for the cross-source hook.
    # Calibration case: anchors VulnTriage field-coverage schema.

