      - "CVE-2024-21887 is a command injection vulnerability (CWE-77, CVSS 9.1) in the web components of Ivanti Connect Secure and Ivanti Policy Secure."
      - "The CISA KEV catalog notes that CVE-2023-46805 can be leveraged in conjunction with CVE-2024-21887, a command injection vulnerability."
      - "Both vulnerabilities are listed in the CISA KEV catalog (added 2024-01-10) as actively exploited with known ransomware campaign use."
    difficulty: complex
    required_fields:
      cve_id: "CVE-2023-46805"
      cvss_score: 8.2
      cwe_ids: ["CWE-287"]
      affected_products: ["Ivanti Connect Secure"]
      kev_listed: true
      ransomware_use: true
      triage_signal: "high"
      mitigations_min_count: 1
    # Verified: NVD ✓ (CVSS 8.2/CWE-287, 9.1/CWE-77) | KEV ✓ (both ransomware:
    # Known, added 2024-01-10, chaining noted in shortDescription) | MISP ✓
    # (Cutting Edge, KrustyLoader events)
    # required_fields anchor on entities[0] = CVE-2023-46805 (first CVE in the
    # question); triage "high" per rule CVSS 7.0–8.9 + KEV ("HIGH — Prioritize").

