  # ===========================================================================
  # Task Type 3: TTP Correlation (7 queries)
  # ===========================================================================
  - id: ttp_001
    question: "What initial access techniques (MITRE ATT&CK) are commonly associated with the exploitation of public-facing application vulnerabilities?"
    task_type: ttp_correlation
    template_expected: ThreatContext
    ground_truth_points:
      - "Exploitation of public-facing applications is tracked as MITRE ATT&CK technique T1190 under the Initial Access tactic (TA0001)."
      - "Threat actors use T1190 to exploit vulnerabilities in internet-facing systems such as web servers, VPN appliances, and email servers to gain initial access."
      - "T1190 is documented in numerous MISP events and CISA advisories in the corpus."
    difficulty: moderate
    required_fields:
      attack_techniques: ["T1190"]
      attack_tactic: ["TA0001", "Initial Access"]
      associated_cves_min_count: 1
      detection_or_mitigation_min_count: 1
    # Verified: MISP ✓ (T1190 in 26 events) | advisories ✓ (26 advisories)
    # Calibration case: anchors ThreatContext field-coverage schema

  - id: ttp_002
    question: "Which CVEs disclosed between 2021 and 2024 are associated with lateral movement techniques in MITRE ATT&CK?"
    task_type: ttp_correlation
    template_expected: ThreatContext
    ground_truth_points:
      - "Lateral movement corresponds to MITRE ATT&CK tactic TA0008, with T1210 (Exploitation of Remote Services) covering exploitation-based lateral movement."
      - "CISA advisories associate lateral movement activity with exploitation of the Microsoft Exchange ProxyShell chain (CVE-2021-34473, CVE-2021-34523, CVE-2021-31207) and Log4Shell (CVE-2021-44228)."
      - "CISA advisories on Chinese state-sponsored actors document lateral movement following exploitation of Ivanti Connect Secure (CVE-2023-46805, CVE-2024-21887) and Cisco IOS XE (CVE-2023-20198)."
      - "The SVR TeamCity advisory documents T1210 alongside exploitation of CVE-2023-42793 (JetBrains TeamCity)."
    difficulty: complex
    required_fields:
      attack_tactic: ["TA0008", "Lateral Movement"]
      associated_cves_min_count: 2
      detection_or_mitigation_min_count: 1
    # No attack_techniques expectation: smoke --all (2026-07-18) showed the
    # tactic-kind chunk aggregation surfaces whichever technique-table chunks
    # retrieval returns (T1046/T1110 here, no T1210/T1021) — attack_tactic and
    # associated_cves_min_count are the deterministic L1 anchors instead.
    # Verified: advisories ✓ (AA24-190A: APT40, Exchange/Log4Shell CVE list;
    # AA25-239A: Ivanti + Cisco IOS XE CVEs; AA23-347A: T1210 + CVE-2023-42793)
    # GT review 2026-07-18: the prior mapping "PrintNightmare/Exchange → T1210"
    # is not documented anywhere in the snapshot and was removed; the new points
    # are grounded in the advisory co-occurrences listed above.

